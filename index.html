<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        /* ตั้งค่าพื้นฐานและฟอนต์ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5f7; /* สีพื้นหลังโทนชมพูพาสเทลอ่อน */
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* กล่องเนื้อหาตรงกลาง */
        .card {
            background-color: #ffffff;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            text-align: center;
        }

        /* รูปโปรไฟล์จำลอง (วงกลม) */
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #ffd1dc;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 {
            color: #d65a74;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 25px;
        }

        /* ปุ่มกด */
        .btn {
            display: inline-block;
            background-color: #ff8fa3;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background-color: #ff758f;
        }

        /* ข้อความที่จะเด้งขึ้นมาเมื่อกดปุ่ม */
        #secret-message {
            margin-top: 20px;
            font-size: 14px;
            color: #d65a74;
            font-weight: bold;
            display: none; /* ซ่อนไว้ก่อน */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🌸</div>
        <h1>สวัสดี! ยินดีต้อนรับสู่เว็บของฉัน</h1>
        <p>
            นี่คือเว็บไซต์แรกที่ฉันฝึกสร้างและนำขึ้น GitHub Pages 
            สามารถแก้ไขข้อความ สี หรือเพิ่มลูกเล่นต่างๆ ได้ตามใจชอบเลย
        </p>
        
        <button class="btn" onclick="showMessage()">ลองกดปุ่มนี้ดูสิ</button>
        
        <div id="secret-message">🎉 เก่งมาก! คุณรันโค้ดสำเร็จแล้ว!</div>
    </div>

    <script>
        // ฟังก์ชัน JavaScript เล็กๆ สำหรับแสดงข้อความเมื่อกดปุ่ม
        function showMessage() {
            const msg = document.getElementById('secret-message');
            if (msg.style.display === 'none' || msg.style.display === '') {
                msg.style.display = 'block';
            } else {
                msg.style.display = 'none';
            }
        }
    </script>

</body>
</html>
